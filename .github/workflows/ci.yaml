name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - name: Benchmarks (budgets)
        run: SPOTISYNC_BENCH=1 dotnet test -c Release --no-build --filter Category=Benchmark --logger "console;verbosity=detailed"
